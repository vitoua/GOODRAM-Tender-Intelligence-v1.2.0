{% extends 'base.html' %}{% block c %}<h1>Filtry CPV</h1>{% for source,rows in [('ted',ted),('prozorro',prozorro)] %}<form class="panel cpvForm"><input type="hidden" name="source" value="{{source}}"><h2>{{source|upper}}</h2><div class="bulk"><button type="button" data-scope="{{source}}" data-value="1">Zaznacz wszystkie</button><button type="button" data-scope="{{source}}" data-value="0" class="dark">Odznacz wszystkie</button></div><div class="cpv">{% for x in rows %}<input name="code" value="{{x.code}}"><input name="name" value="{{x.name if source=='prozorro' else x.name_pl}}"><label><input type="checkbox" name="active_codes" value="{{x.code}}" {% if x.active %}checked{% endif %}></label>{% endfor %}</div><button>Zapisz</button></form>{% endfor %}{% endblock %}{% block scripts %}<script src="/static/app.js"></script>{% endblock %}
