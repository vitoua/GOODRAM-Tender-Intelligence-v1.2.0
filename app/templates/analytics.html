{% extends 'base.html' %}{% block c %}<h1>Analityka</h1><div class="kpis"><div><b>{{count}}</b><span>Przetargi</span></div><div><b>{{data.countries|length}}</b><span>Kraje</span></div><div><b>{{data.sources|length}}</b><span>Źródła</span></div></div><div class="charts"><article><canvas id="country"></canvas></article><article><canvas id="source"></canvas></article><article><canvas id="cpv"></canvas></article></div>{% endblock %}{% block scripts %}<script>const D={{data|tojson}};function c(id,type,obj){new Chart(document.getElementById(id),{type,data:{labels:Object.keys(obj),datasets:[{data:Object.values(obj),backgroundColor:['#e30613','#111','#777','#b9000b']}]}})}c('country','bar',D.countries);c('source','doughnut',D.sources);c('cpv','bar',D.cpv);</script>{% endblock %}
